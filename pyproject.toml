[project]
name = "matrix-algorithms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "0xDadam", email = "ajaniczek@student.agh.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
binet = "src.matrix_algorithms.lab1.binet:main"
strassen = "src.matrix_algorithms.lab1.strassen:main"
laderman = "src.matrix_algorithms.lab1.laderman:main"
benchmark = "scripts.benchmark:main"
benchmark_powers = "scripts.benchmark_powers:main"
plot_results = "scripts.plot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.3.1",
    "pytest>=9.1.1",
]
