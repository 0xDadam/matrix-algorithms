[project]
name = "matrix-algorithms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "0xDadam", email = "ajaniczek@student.agh.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
]

[project.scripts]
matrix-algorithms = "matrix_algorithms:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.3.1",
    "pytest>=9.1.1",
]
